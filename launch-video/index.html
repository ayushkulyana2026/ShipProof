<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ShipProof launch video</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: relative;
        overflow: hidden;
      }
      #stage canvas {
        display: block;
      }
      #ov {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: "Inter", system-ui, sans-serif;
        color: #fff;
      }
      .cap {
        position: absolute;
        left: 6%;
        right: 6%;
        text-align: center;
        opacity: 0;
      }
      .h1 {
        font-weight: 800;
        font-size: calc(var(--u) * 7.4);
        letter-spacing: -0.04em;
        line-height: 1.02;
        text-shadow: 0 6px 40px rgba(0, 0, 0, 0.6);
      }
      .h2 {
        font-weight: 600;
        font-size: calc(var(--u) * 3.1);
        letter-spacing: -0.01em;
        line-height: 1.25;
        color: #bfeedd;
        text-shadow: 0 3px 20px rgba(0, 0, 0, 0.7);
      }
      .h3 {
        font-weight: 600;
        font-size: calc(var(--u) * 2.4);
        color: #9fd8c2;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
      }
      .mega {
        font-weight: 800;
        font-size: calc(var(--u) * 15);
        letter-spacing: -0.045em;
        line-height: 1;
        background: linear-gradient(180deg, #fff6d6 0%, #ffd36a 55%, #e8a326 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 8px 40px rgba(0, 0, 0, 0.65));
      }
      .portrait .mega {
        font-size: calc(var(--u) * 12.5);
      }
      .mega,
      .counter {
        font-variant-numeric: tabular-nums;
      }
      .backdrop {
        left: -10%;
        right: -10%;
        height: 70%;
        background: radial-gradient(ellipse 45% 50% at center, rgba(4, 12, 6, 0.78) 0%, rgba(4, 12, 6, 0.45) 45%, transparent 75%);
      }
      .red {
        color: #ff5d5d;
      }
      .grn {
        color: #3ee6a0;
      }
      .counter {
        display: inline-flex;
        gap: calc(var(--u) * 3);
        padding: calc(var(--u) * 1.4) calc(var(--u) * 3);
        border-radius: 999px;
        background: rgba(2, 20, 14, 0.62);
        border: 1px solid rgba(62, 230, 160, 0.35);
        font-weight: 700;
        font-size: calc(var(--u) * 3);
        backdrop-filter: blur(6px);
      }
      .counter small {
        font-weight: 500;
        color: #9fd8c2;
        font-size: 0.7em;
      }
      .barlab {
        position: absolute;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: calc(var(--u) * 2.05);
        font-weight: 600;
        color: #e9fff6;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        opacity: 0;
        white-space: nowrap;
      }
      .barlab b {
        color: #ff7a7a;
        font-weight: 700;
      }
      .pill {
        display: inline-block;
        padding: calc(var(--u) * 1.5) calc(var(--u) * 3.6);
        border-radius: 999px;
        background: #0b7a55;
        box-shadow: 0 0 0 2px rgba(62, 230, 160, 0.5), 0 10px 40px rgba(11, 122, 85, 0.6);
        font-weight: 700;
        font-size: calc(var(--u) * 3);
      }
      .word {
        font-weight: 800;
        font-size: calc(var(--u) * 9);
        letter-spacing: -0.045em;
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="ov"></div><div id="fade"></div></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
